<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline Certificate OCR Comparison Demo (.NET 8 + React)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const OFFLINE_ENGINES = [
      {
        id: "paddleocr",
        name: "PaddleOCR (PP-OCRv4 Offline)",
        architecture: "CNN Detection + SVTR Recognition (ONNX)",
        dotNetIntegration: "Pure .NET via Sdcb.PaddleOCR / ONNX Runtime (No Python)",
        license: "Apache 2.0 (Free Offline)",
        supportsHandwriting: true,
        supportsPrintedText: true,
        strengthSummary: "Best all-rounder for certificates: handles stamps, seals, skewed scans & mixed printed + handwritten text offline.",
        highlights: ["100% Offline in .NET", "Reads stamps, seals & mixed handwriting", "High accuracy on decorative certificate fonts"]
      },
      {
        id: "trocr",
        name: "Microsoft TrOCR (Offline ONNX Transformer)",
        architecture: "Vision Transformer Encoder + Text Decoder",
        dotNetIntegration: "Pure .NET via Microsoft.ML.OnnxRuntime (No Python)",
        license: "MIT License (Free Offline)",
        supportsHandwriting: true,
        supportsPrintedText: true,
        strengthSummary: "Best-in-class offline handwriting & cursive signature recognition using local ONNX weights.",
        highlights: ["Best for cursive names & handwritten notes", "Runs offline via ONNX Runtime in C#", "Strong on noisy/faded scans"]
      },
      {
        id: "tesseract",
        name: "Tesseract OCR v5 (LSTM Offline)",
        architecture: "LSTM Neural Engine (C++ Native Interop)",
        dotNetIntegration: "Pure .NET via Tesseract NuGet + local tessdata (No Python)",
        license: "Apache 2.0 (Free Offline)",
        supportsHandwriting: false,
        supportsPrintedText: true,
        strengthSummary: "Fastest lightweight CPU engine for clean 300-DPI printed certificates, but struggles with cursive handwriting.",
        highlights: ["Ultra-fast CPU execution", "100+ offline language packs", "Weak on cursive handwriting & fancy scripts"]
      },
      {
        id: "windowsocr",
        name: "Windows Native Media.Ocr (Offline OS Engine)",
        architecture: "Built-in Windows 10/11 UWP OCR Engine",
        dotNetIntegration: "Native Windows.Media.Ocr API in .NET (Zero external models)",
        license: "Built into Windows (Free Offline)",
        supportsHandwriting: false,
        supportsPrintedText: true,
        strengthSummary: "Zero-dependency offline OCR built directly into Windows OS; fast on clean printed text.",
        highlights: ["Zero extra model files needed", "Instant startup on Windows", "Limited cursive handwriting support"]
      },
      {
        id: "easyocr-onnx",
        name: "EasyOCR (CRAFT + CRNN Offline ONNX)",
        architecture: "CRAFT Text Detector + CRNN Recognizer",
        dotNetIntegration: "Pure .NET via Microsoft.ML.OnnxRuntime (No Python)",
        license: "Apache 2.0 (Free Offline)",
        supportsHandwriting: true,
        supportsPrintedText: true,
        strengthSummary: "Strong on mobile camera photos of certificates, tilted angles, and semi-cursive handwriting.",
        highlights: ["Handles tilted/camera photos well", "80+ languages offline", "Good printed + moderate handwriting"]
      },
      {
        id: "doctr-onnx",
        name: "Mindee docTR (DBNet + ViT Offline ONNX)",
        architecture: "Two-Stage Document Vision Transformer",
        dotNetIntegration: "Pure .NET via Microsoft.ML.OnnxRuntime (No Python)",
        license: "Apache 2.0 (Free Offline)",
        supportsHandwriting: true,
        supportsPrintedText: true,
        strengthSummary: "High-precision bounding boxes and structured field layout extraction for official certificates.",
        highlights: ["Sharp bounding-box localization", "Apache 2.0 commercial-safe", "Strong on structured certificate layouts"]
      }
    ];

    function simulateOfflineDotNetResult(engineId, fileName) {
      const engine = OFFLINE_ENGINES.find(e => e.id === engineId) || OFFLINE_ENGINES[0];
      const isTesseract = engineId === "tesseract";
      const isWindows = engineId === "windowsocr";
      const isTrOcr = engineId === "trocr";
      const isPaddle = engineId === "paddleocr";

      const formFields = {
        personName: isTesseract ? "Priya Na1r (Script font artifact)" : "Priya Nair",
        certificateTitle: "Certificate of Excellence — Certified Cloud Security Architect",
        authorityName: "International Cloud & Security Board",
        certificateId: isTesseract ? "ICSB-2026-9041Z" : "ICSB-2026-90412",
        issueDate: "April 10, 2026",
        expiryDate: "April 10, 2029",
        gradeOrScore: "97.2% (Distinction)",
        handwrittenSignatureOrNote: isTesseract
          ? "[Unreadable cursive: Appr0v~d w/ d1st1nct10n]"
          : isWindows
          ? "[Cursive signature skipped by printed-only filter]"
          : isTrOcr
          ? "Approved with distinction — Dr. Marcus Vance (98% cursive confidence)"
          : "Approved with distinction — Dr. Marcus Vance"
      };

      const rawText = [
        "CERTIFICATE OF EXCELLENCE",
        `Certificate Authority: ${formFields.authorityName}`,
        `Recipient: ${formFields.personName}`,
        `Program: ${formFields.certificateTitle}`,
        `Certificate ID: ${formFields.certificateId}`,
        `Issue Date: ${formFields.issueDate}`,
        `Expiry Date: ${formFields.expiryDate}`,
        `Grade: ${formFields.gradeOrScore}`,
        `Handwritten Note: ${formFields.handwrittenSignatureOrNote}`
      ].join("\n");

      return {
        engineId: engine.id,
        engineName: engine.name,
        fileName: fileName || "Sample_Certificate.pdf",
        fileType: (fileName || ".pdf").split(".").pop(),
        latencyMs: isWindows ? 115 : isTesseract ? 180 : isPaddle ? 290 : isTrOcr ? 560 : 390,
        accuracyConfidence: isTesseract ? 0.77 : isWindows ? 0.81 : isPaddle ? 0.96 : isTrOcr ? 0.95 : 0.91,
        executionMode: "Standalone Browser Demo (Start .NET 8 API for Live Backend)",
        formFields,
        rawExtractedText: rawText,
        highlights: engine.highlights
      };
    }

    function App() {
      const [apiBase] = useState(window.location.origin.startsWith("http") ? window.location.origin : "http://localhost:5000");
      const [dotNetConnected, setDotNetConnected] = useState(false);
      const [engines, setEngines] = useState(OFFLINE_ENGINES);
      const [selectedEngine, setSelectedEngine] = useState("paddleocr");
      const [uploadedFile, setUploadedFile] = useState(null);
      const [imagePreview, setImagePreview] = useState(null);
      const [isProcessing, setIsProcessing] = useState(false);
      const [activeResult, setActiveResult] = useState(null);
      const [comparisonResults, setComparisonResults] = useState([]);
      const [formValues, setFormValues] = useState({
        personName: "",
        certificateTitle: "",
        authorityName: "",
        certificateId: "",
        issueDate: "",
        expiryDate: "",
        gradeOrScore: "",
        handwrittenSignatureOrNote: ""
      });

      useEffect(() => {
        fetch(`${apiBase}/api/ocr/engines`)
          .then(r => r.ok ? r.json() : Promise.reject())
          .then(data => {
            setEngines(data);
            setDotNetConnected(true);
          })
          .catch(() => setDotNetConnected(false));
      }, [apiBase]);

      const onSelectFile = (e) => {
        const f = e.target.files?.[0];
        if (!f) return;
        setUploadedFile(f);
        if (f.type.startsWith("image/")) {
          setImagePreview(URL.createObjectURL(f));
        } else {
          setImagePreview(null);
        }
      };

      const handleExtractSelected = async () => {
        setIsProcessing(true);
        try {
          if (dotNetConnected && uploadedFile) {
            const fd = new FormData();
            fd.append("engineId", selectedEngine);
            fd.append("file", uploadedFile);
            const res = await fetch(`${apiBase}/api/ocr/extract`, { method: "POST", body: fd });
            const data = await res.json();
            setActiveResult(data);
            setFormValues(data.formFields);
            addOrUpdateComparison(data);
          } else {
            await new Promise(r => setTimeout(r, 250));
            const sim = simulateOfflineDotNetResult(selectedEngine, uploadedFile?.name || "Sample_Certificate.png");
            setActiveResult(sim);
            setFormValues(sim.formFields);
            addOrUpdateComparison(sim);
          }
        } finally {
          setIsProcessing(false);
        }
      };

      const handleCompareAll = async () => {
        setIsProcessing(true);
        try {
          if (dotNetConnected && uploadedFile) {
            const fd = new FormData();
            fd.append("file", uploadedFile);
            const res = await fetch(`${apiBase}/api/ocr/compare-all`, { method: "POST", body: fd });
            const all = await res.json();
            setComparisonResults(all);
            const current = all.find(x => x.engineId === selectedEngine) || all[0];
            if (current) {
              setActiveResult(current);
              setFormValues(current.formFields);
            }
          } else {
            await new Promise(r => setTimeout(r, 400));
            const all = engines.map(eng => simulateOfflineDotNetResult(eng.id, uploadedFile?.name || "Sample_Certificate.png"));
            setComparisonResults(all);
            const current = all.find(x => x.engineId === selectedEngine) || all[0];
            setActiveResult(current);
            setFormValues(current.formFields);
          }
        } finally {
          setIsProcessing(false);
        }
      };

      const addOrUpdateComparison = (item) => {
        setComparisonResults(prev => [...prev.filter(x => x.engineId !== item.engineId), item]);
      };

      const selectedMeta = engines.find(e => e.id === selectedEngine) || engines[0];

      return (
        <div className="max-w-7xl mx-auto p-6 space-y-6">
          {/* Top Bar */}
          <header className="flex flex-col md:flex-row md:items-center md:justify-between gap-4 border-b border-slate-800 pb-5">
            <div>
              <div className="flex items-center gap-2">
                <span className="text-xs font-bold uppercase tracking-wider px-2.5 py-1 rounded-full bg-indigo-500/20 text-indigo-300">
                  100% Pure .NET 8 + React • No Python
                </span>
                <span className="text-xs font-semibold px-2.5 py-1 rounded-full bg-emerald-500/15 text-emerald-300">
                  Offline Air-Gapped Ready
                </span>
              </div>
              <h1 className="text-2xl md:text-3xl font-bold mt-2 text-white">
                Offline Certificate OCR Evaluation & Comparison Demo
              </h1>
              <p className="text-slate-400 text-sm mt-1">
                Compare PaddleOCR, Microsoft TrOCR, Tesseract v5, Windows Native OCR, EasyOCR & docTR on uploaded PDFs or certificate images.
              </p>
            </div>
            <div className="flex items-center gap-3 bg-slate-900 border border-slate-800 px-4 py-3 rounded-xl">
              <span className={`h-3 w-3 rounded-full ${dotNetConnected ? "bg-emerald-400" : "bg-amber-400"}`}></span>
              <div className="text-xs">
                <div className="font-semibold text-slate-200">
                  {dotNetConnected ? ".NET 8 Web API Connected" : "Offline Browser Demo Mode"}
                </div>
                <div className="text-slate-400">{apiBase}</div>
              </div>
            </div>
          </header>

          {/* Main 2-Column Workspace */}
          <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
            {/* Left Panel: Dropdown + Upload + Actions */}
            <div className="lg:col-span-5 space-y-5">
              <div className="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-4">
                <h2 className="text-lg font-semibold text-white">1. Select Offline OCR Engine</h2>
                <div>
                  <label className="block text-xs font-medium text-slate-400 mb-1.5">
                    Offline OCR Engine (Text & Handwriting)
                  </label>
                  <select
                    value={selectedEngine}
                    onChange={(e) => setSelectedEngine(e.target.value)}
                    className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-indigo-500"
                  >
                    {engines.map(eng => (
                      <option key={eng.id} value={eng.id}>
                        {eng.name} — {eng.supportsHandwriting ? "Text + Handwriting" : "Printed Text Only"}
                      </option>
                    ))}
                  </select>
                </div>

                {/* Selected Engine Details */}
                {selectedMeta && (
                  <div className="bg-slate-950 border border-slate-800 rounded-xl p-4 text-xs space-y-2.5">
                    <div className="flex items-center justify-between gap-2">
                      <span className="font-semibold text-indigo-300">{selectedMeta.architecture}</span>
                      <span className="px-2 py-0.5 rounded bg-emerald-500/15 text-emerald-300 whitespace-nowrap">
                        {selectedMeta.license}
                      </span>
                    </div>
                    <p className="text-slate-300 leading-relaxed">{selectedMeta.strengthSummary}</p>
                    <div className="text-[11px] text-slate-400 font-mono bg-slate-900 px-2.5 py-1.5 rounded">
                      {selectedMeta.dotNetIntegration}
                    </div>
                    <div className="flex flex-wrap gap-2 pt-1">
                      <span className="px-2 py-0.5 rounded bg-sky-500/15 text-sky-300">
                        ✓ Printed Text
                      </span>
                      <span className={`px-2 py-0.5 rounded ${selectedMeta.supportsHandwriting ? "bg-purple-500/15 text-purple-300" : "bg-rose-500/15 text-rose-300"}`}>
                        {selectedMeta.supportsHandwriting ? "✓ Handwriting / Cursive" : "✕ Printed Only (Weak Handwriting)"}
                      </span>
                    </div>
                  </div>
                )}

                <h2 className="text-lg font-semibold text-white pt-1">2. Upload Certificate (Image or PDF)</h2>
                <label className="flex flex-col items-center justify-center border-2 border-dashed border-slate-700 hover:border-indigo-500 rounded-xl p-5 cursor-pointer transition bg-slate-950/60">
                  <span className="px-3 py-1.5 rounded-lg bg-slate-800 text-xs font-semibold text-indigo-300 mb-2">
                    Choose File (Upload Image / PDF)
                  </span>
                  <span className="text-sm font-medium text-slate-200 text-center">
                    {uploadedFile ? uploadedFile.name : "Supports PNG, JPG, WEBP, TIFF, BMP, or PDF"}
                  </span>
                  <span className="text-xs text-slate-400 mt-1">
                    {uploadedFile ? `${(uploadedFile.size / 1024).toFixed(1)} KB` : "No file? Click Extract below to test with built-in certificate sample"}
                  </span>
                  <input
                    type="file"
                    accept=".pdf,image/*"
                    onChange={onSelectFile}
                    className="hidden"
                  />
                </label>

                {imagePreview && (
                  <div className="rounded-xl overflow-hidden border border-slate-800 bg-slate-950 max-h-44 flex items-center justify-center p-2">
                    <img src={imagePreview} alt="Uploaded certificate" className="max-h-40 object-contain rounded" />
                  </div>
                )}

                <div className="grid grid-cols-2 gap-3 pt-2">
                  <button
                    onClick={handleExtractSelected}
                    disabled={isProcessing}
                    className="bg-indigo-600 hover:bg-indigo-500 disabled:opacity-50 text-white font-semibold text-sm py-2.5 px-4 rounded-xl transition cursor-pointer"
                  >
                    {isProcessing ? "Running OCR..." : "Extract Selected OCR"}
                  </button>
                  <button
                    onClick={handleCompareAll}
                    disabled={isProcessing}
                    className="bg-emerald-600 hover:bg-emerald-500 disabled:opacity-50 text-white font-semibold text-sm py-2.5 px-4 rounded-xl transition cursor-pointer"
                  >
                    Compare All 6 OCRs
                  </button>
                </div>
              </div>
            </div>

            {/* Right Panel: Certificate Output Form */}
            <div className="lg:col-span-7 space-y-5">
              <div className="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-4">
                <div className="flex flex-wrap items-center justify-between gap-2">
                  <div>
                    <h2 className="text-lg font-semibold text-white">3. Extracted Certificate Information Form</h2>
                    <p className="text-xs text-slate-400">Auto-populated from the selected offline OCR engine</p>
                  </div>
                  {activeResult && (
                    <div className="flex items-center gap-2 text-xs">
                      <span className={`px-2.5 py-1 rounded-lg font-bold ${
                        activeResult.accuracyConfidence >= 0.90 ? "bg-emerald-500/15 text-emerald-300" :
                        activeResult.accuracyConfidence >= 0.80 ? "bg-amber-500/15 text-amber-300" :
                        "bg-rose-500/15 text-rose-300"
                      }`}>
                        Accuracy: {(activeResult.accuracyConfidence * 100).toFixed(0)}%
                      </span>
                      <span className="px-2.5 py-1 rounded-lg bg-slate-800 text-slate-300 font-mono">
                        {activeResult.latencyMs} ms
                      </span>
                    </div>
                  )}
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                  <div>
                    <label className="block text-xs font-medium text-slate-400 mb-1">Person Name</label>
                    <input
                      type="text"
                      value={formValues.personName}
                      onChange={e => setFormValues({ ...formValues, personName: e.target.value })}
                      placeholder="Extracted person name..."
                      className="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white"
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-medium text-slate-400 mb-1">Authority Name (Issuer)</label>
                    <input
                      type="text"
                      value={formValues.authorityName}
                      onChange={e => setFormValues({ ...formValues, authorityName: e.target.value })}
                      placeholder="Issuing authority..."
                      className="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white"
                    />
                  </div>
                  <div className="md:col-span-2">
                    <label className="block text-xs font-medium text-slate-400 mb-1">Certificate Title / Course</label>
                    <input
                      type="text"
                      value={formValues.certificateTitle}
                      onChange={e => setFormValues({ ...formValues, certificateTitle: e.target.value })}
                      placeholder="Certificate title..."
                      className="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white"
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-medium text-slate-400 mb-1">Certificate / Credential ID</label>
                    <input
                      type="text"
                      value={formValues.certificateId}
                      onChange={e => setFormValues({ ...formValues, certificateId: e.target.value })}
                      placeholder="Credential ID..."
                      className="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white"
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-medium text-slate-400 mb-1">Grade / Score</label>
                    <input
                      type="text"
                      value={formValues.gradeOrScore}
                      onChange={e => setFormValues({ ...formValues, gradeOrScore: e.target.value })}
                      placeholder="Score or grade..."
                      className="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white"
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-medium text-slate-400 mb-1">Issue Date</label>
                    <input
                      type="text"
                      value={formValues.issueDate}
                      onChange={e => setFormValues({ ...formValues, issueDate: e.target.value })}
                      placeholder="Issue date..."
                      className="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white"
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-medium text-slate-400 mb-1">Expiry Date</label>
                    <input
                      type="text"
                      value={formValues.expiryDate}
                      onChange={e => setFormValues({ ...formValues, expiryDate: e.target.value })}
                      placeholder="Expiry date..."
                      className="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white"
                    />
                  </div>
                  <div className="md:col-span-2">
                    <label className="block text-xs font-medium text-purple-300 mb-1">
                      Handwritten Signature / Registrar Endorsement
                    </label>
                    <input
                      type="text"
                      value={formValues.handwrittenSignatureOrNote}
                      onChange={e => setFormValues({ ...formValues, handwrittenSignatureOrNote: e.target.value })}
                      placeholder="Handwritten note or signature text..."
                      className="w-full bg-slate-950 border border-purple-500/40 rounded-lg px-3 py-2 text-sm text-purple-200"
                    />
                  </div>
                </div>

                <div>
                  <div className="flex items-center justify-between mb-1">
                    <label className="text-xs font-medium text-slate-400">Raw OCR Extracted Text</label>
                    {activeResult && <span className="text-[11px] text-indigo-300">{activeResult.executionMode}</span>}
                  </div>
                  <textarea
                    rows="5"
                    readOnly
                    value={activeResult ? activeResult.rawExtractedText : "Select an offline OCR engine and click 'Extract Selected OCR' or 'Compare All 6 OCRs'..."}
                    className="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs font-mono text-slate-300"
                  />
                </div>
              </div>
            </div>
          </div>

          {/* Side-by-Side Comparison Matrix */}
          {comparisonResults.length > 0 && (
            <div className="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-3">
              <div className="flex items-center justify-between">
                <div>
                  <h2 className="text-lg font-semibold text-white">4. Side-by-Side Offline OCR Comparison Matrix</h2>
                  <p className="text-xs text-slate-400">Click any row to load that OCR engine's extracted values into the form above</p>
                </div>
                <button
                  onClick={() => setComparisonResults([])}
                  className="text-xs px-3 py-1.5 rounded-lg bg-slate-800 text-slate-300 hover:text-white cursor-pointer"
                >
                  Clear Table
                </button>
              </div>
              <div className="overflow-x-auto">
                <table className="w-full text-left text-xs border-collapse">
                  <thead>
                    <tr className="border-b border-slate-800 text-slate-400">
                      <th className="py-2.5 px-3">Offline OCR Engine</th>
                      <th className="py-2.5 px-3">Confidence</th>
                      <th className="py-2.5 px-3">Speed</th>
                      <th className="py-2.5 px-3">Person Name</th>
                      <th className="py-2.5 px-3">Authority Name</th>
                      <th className="py-2.5 px-3">Expiry Date</th>
                      <th className="py-2.5 px-3">Handwritten Note / Signature</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-slate-800/80">
                    {comparisonResults.map(row => (
                      <tr
                        key={row.engineId}
                        onClick={() => {
                          setSelectedEngine(row.engineId);
                          setActiveResult(row);
                          setFormValues(row.formFields);
                        }}
                        className={`cursor-pointer transition ${row.engineId === selectedEngine ? "bg-indigo-500/10" : "hover:bg-slate-800/40"}`}
                      >
                        <td className="py-2.5 px-3 font-semibold text-white">{row.engineName}</td>
                        <td className="py-2.5 px-3">
                          <span className={`px-2 py-0.5 rounded font-bold ${
                            row.accuracyConfidence >= 0.90 ? "bg-emerald-500/15 text-emerald-300" :
                            row.accuracyConfidence >= 0.80 ? "bg-amber-500/15 text-amber-300" :
                            "bg-rose-500/15 text-rose-300"
                          }`}>
                            {(row.accuracyConfidence * 100).toFixed(0)}%
                          </span>
                        </td>
                        <td className="py-2.5 px-3 font-mono text-slate-300">{row.latencyMs} ms</td>
                        <td className="py-2.5 px-3 text-slate-200">{row.formFields.personName}</td>
                        <td className="py-2.5 px-3 text-slate-300">{row.formFields.authorityName}</td>
                        <td className="py-2.5 px-3 text-slate-300">{row.formFields.expiryDate}</td>
                        <td className="py-2.5 px-3 text-purple-300">{row.formFields.handwrittenSignatureOrNote}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
